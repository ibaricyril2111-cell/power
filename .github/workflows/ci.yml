name: CI

# Vérifie chaque push/PR. Vercel applique les mêmes contrôles dans verify-release.mjs
# avant de construire et publier ; deploy.yml vérifie ensuite le site réellement déployé.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: power-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Activer Yarn
        run: corepack enable

      - name: Installer les dépendances
        run: yarn install --immutable
        env:
          # `postinstall` lance `prisma generate`, qui n'a pas besoin d'une vraie base
          # mais exige que la variable existe.
          DATABASE_URL: postgresql://user:pass@localhost:5432/db

      - name: Contrôle des variables publiques
        run: node scripts/check-public-env.mjs

      - name: Typecheck
        run: yarn typecheck

      - name: Tests
        run: yarn test

      - name: Build de production
        run: yarn build
        env:
          AUTH_SECRET: POWER_PRIVATE_ENV_CANARY_auth
          RESEND_API_KEY: POWER_PRIVATE_ENV_CANARY_email

      - name: Contrôle du bundle public
        run: node scripts/check-public-env.mjs --bundle
