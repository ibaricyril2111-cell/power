name: Verify Production Deployment
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: power-production-verification
  cancel-in-progress: true
jobs:
  verify-production:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Vercel Git integration builds using scripts/verify-release.mjs.
      # No Vercel access token or production credential is required in GitHub.
      - name: Vérifier le commit publié sur POWER
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node scripts/check-deployed-release.mjs "$EXPECTED_SHA"
      - name: Installer le moteur E2E isolé
        run: npm install --prefix "$RUNNER_TEMP/power-e2e" --no-save @playwright/test@1.64.1
      - name: Installer Chromium
        run: node "$RUNNER_TEMP/power-e2e/node_modules/@playwright/test/cli.js" install --with-deps chromium
      - name: Tests frontend déployé — 320, 390, 768 et 1440 pixels
        env:
          NODE_PATH: ${{ runner.temp }}/power-e2e/node_modules
        run: node "$RUNNER_TEMP/power-e2e/node_modules/@playwright/test/cli.js" test --config e2e/playwright.config.cjs
