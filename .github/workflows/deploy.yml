name: Deploy Production

# Déploiement continu, conditionné aux tests.
#
# Ne se déclenche QUE si le workflow CI (typecheck + tests) s'est terminé avec succès
# sur `main`. Une CI rouge → aucun déploiement.
#
# Configuration manquante : échec explicite, jamais un faux succès.
#
# CONFIGURATION (une seule fois, côté GitHub) :
#   Settings → Secrets and variables → Actions → New repository secret
#     VERCEL_TOKEN      → jeton personnel Vercel (vercel.com/account/tokens)
#     VERCEL_ORG_ID     → équipe POWER vérifiée
#     VERCEL_PROJECT_ID → projet POWER vérifié (jamais TABLE)
#
# ET : désactiver l'auto-déploiement Git de Vercel (Project → Settings → Git) pour
# éviter un déploiement en double qui n'attendrait pas les tests.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: power-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    # Ne rien faire si la CI a échoué.
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository }}

    steps:
      - name: Vérifier la configuration Vercel
        id: check
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::error::Configuration Vercel incomplète : token, organisation et projet requis."
            exit 1
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.configured == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        if: steps.check.outputs.configured == 'true'
        with:
          node-version: 22

      - name: Installer Vercel CLI
        if: steps.check.outputs.configured == 'true'
        run: npm install --global vercel@65.0.0

      - name: Récupérer la configuration Vercel
        if: steps.check.outputs.configured == 'true'
        run: vercel pull --yes --environment=production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build de production
        if: steps.check.outputs.configured == 'true'
        run: vercel build --prod
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Contrôle du bundle public
        if: steps.check.outputs.configured == 'true'
        run: node scripts/check-public-env.mjs --bundle

      - name: Déployer
        if: steps.check.outputs.configured == 'true'
        run: vercel deploy --prebuilt --prod
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
