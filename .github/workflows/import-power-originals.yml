name: Import original POWER artwork

on:
  push:
    branches: [fix/unify-power-mascot-design]
    paths: [.github/workflows/import-power-originals.yml]

permissions:
  contents: write

concurrency:
  group: power-original-artwork-import
  cancel-in-progress: false

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/unify-power-mascot-design
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image conversion tool (isolated from app)
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Verify originals and extract individual characters
        run: |
          python - <<'PY'
          import hashlib, io, json, urllib.request
          from pathlib import Path
          from PIL import Image
          sources = {
            'atlas': (
              'https://d2jqrm6oza8nb6.cloudfront.net/datasets/21eeec2a-4d27-4d46-bba9-9c0525c218cd.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZWJkZGYzODlmMzQ1NjU1YiIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTE0MzU2MX0.tzO1kaMiRDU_W-83T4ak3W3J9uvhez8Or_KU5eQLHW8',
              '994a5e1ea081cdcaf7926a6e0e162ef66ee1cc2bc3b5cc3dc2b98f4f86372878', (1254, 1254)),
            'stars': (
              'https://d2jqrm6oza8nb6.cloudfront.net/datasets/13147caa-002e-4750-94f0-c45ad6cb769b.jpeg?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYzQzOTFiNDU3NGVkNmY3ZCIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTEzNjA2OX0.NTdfBwPcGyytRp004oUaFb04BPLJB18jWaHeLB8JQDU',
              'f069c044597eb574b69c25864aa1a333fb6c06f1f10450c65951065b789fde10', (1284, 630)),
          }
          images = {}
          for key, (url, expected_sha, expected_size) in sources.items():
            with urllib.request.urlopen(url, timeout=45) as response:
              data = response.read(15 * 1024 * 1024 + 1)
            if len(data) > 15 * 1024 * 1024 or hashlib.sha256(data).hexdigest() != expected_sha:
              raise RuntimeError('Original artwork verification failed: ' + key)
            im = Image.open(io.BytesIO(data))
            im.load()
            if im.size != expected_size:
              raise RuntimeError('Unexpected artwork dimensions: ' + key)
            images[key] = im.convert('RGBA')
          keys = ['mangue','ananas','passion','fraise','banane','poire','clementine','citron-vert','kiwi','avocat','pomme','citron','tomate','carotte','aubergine','concombre','courgette','pomme-de-terre','oignon','potiron','raisin','poivron','salade','persil','framboise']
          stars = {'mangue':(56,99,330,375),'fraise':(356,99,629,375),'ananas':(655,99,929,375),'tomate':(954,99,1228,375)}
          out = Path('public/brand/mascots/v2')
          out.mkdir(parents=True, exist_ok=True)
          manifest = {}
          atlas = images['atlas']
          for index, key in enumerate(keys):
            col, row = index % 5, index // 5
            box = (round(col*atlas.width/5), round(row*atlas.height/5), round((col+1)*atlas.width/5), round((row+1)*atlas.height/5))
            source = 'stars' if key in stars else 'atlas'
            crop = images[source].crop(stars[key] if key in stars else box)
            # Keep native pixels. Never enlarge a 120px contact sheet or regenerate faces.
            path = out / (key + '.webp')
            crop.save(path, 'WEBP', quality=95, method=4)
            manifest[key] = {'width':crop.width,'height':crop.height,'sourceSha256':sources[source][1],'sha256':hashlib.sha256(path.read_bytes()).hexdigest()}
          (out / 'sources.json').write_text(json.dumps(manifest, indent=2) + '\n')
          print('Verified and imported', len(keys), 'individual character images at native resolution.')
          PY
      - name: Save artwork only on preview branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- public/brand/mascots/v2
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'assets: original POWER characters, one file per product'
          git push origin HEAD:fix/unify-power-mascot-design
