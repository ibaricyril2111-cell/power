name: POWER exact approved storefront
on:
  push:
    branches: [fix/unify-power-mascot-design]
    paths: [.github/workflows/power-approved-facade.yml]
permissions:
  contents: write
concurrency:
  group: power-approved-facade
  cancel-in-progress: false
jobs:
  verify-facade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/unify-power-mascot-design
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python -m pip install --disable-pip-version-check Pillow==11.3.0 playwright==1.55.0
      - name: Preserve exact facade pixels from the approved reference
        run: |
          mkdir -p power-facade-evidence
          python - <<'PY'
          import hashlib, io, json, subprocess, urllib.request
          from pathlib import Path
          from PIL import Image
          path = Path('components/sections/hero-section.tsx')
          expected_blob = '2edf22aaac92248d2b44ff34689fe00915b3364a'
          assert subprocess.check_output(['git','hash-object',str(path)],text=True).strip() == expected_blob, 'Hero changed since review; stop rather than overwrite'
          url = 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/d101c251-b2b1-445d-83b9-7f26a7d2ca27.jpeg?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZWQwN2QxNGJhNWM2YmE5ZSIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTIyNDUyM30.VQCSDbiYwvem4GOhKUq2rc7BWcBy7fR_C3xpEtsV2co'
          expected = '3ddf6e945f973f8e1a8f808c65f454a06b503b892243c531ee1915841bcd0e3b'
          with urllib.request.urlopen(url,timeout=45) as response:
            data = response.read(10000001)
          assert len(data) <= 10000000 and hashlib.sha256(data).hexdigest() == expected, 'Reference checksum mismatch'
          source = Image.open(io.BytesIO(data)).convert('RGB')
          assert source.size == (710,1536)
          box = (0,350,710,669)
          crop = source.crop(box)
          out = Path('public/brand/facade-power-validee.webp')
          assert not out.exists(), 'Do not replace any existing approved asset'
          out.parent.mkdir(parents=True,exist_ok=True)
          crop.save(out,'WEBP',lossless=True,method=4)
          decoded = Image.open(out).convert('RGB')
          assert decoded.size == (710,319) and decoded.tobytes() == crop.tobytes(), 'Pixel preservation failed'
          manifest = {'sourceSha256':expected,'sourceSize':[710,1536],'crop':list(box),'width':710,'height':319,'method':'exact original pixels, lossless WebP, no generation, no resizing','pixelSha256':hashlib.sha256(crop.tobytes()).hexdigest()}
          Path('public/brand/facade-power-validee.json').write_text(json.dumps(manifest,indent=2)+'\n')
          Path('power-facade-evidence/pixel-check.json').write_text(json.dumps(manifest,indent=2)+'\n')
          PY
      - name: Integrate the uncut image without overlays
        run: |
          cat > components/sections/hero-section.tsx <<'TSX'
          import Image from "next/image"
          import Link from "next/link"
          import { Leaf, Truck, MapPin, Heart, ArrowRight } from "lucide-react"

          const benefits = [
            { icon: Leaf, title: "Produits sélectionnés" },
            { icon: Truck, title: "Click & Collect et livraison" },
            { icon: MapPin, title: "Magasin à Alfortville" },
            { icon: Heart, title: "Des familles plus heureuses" },
          ]

          interface HeroSectionProps { title?: string; subtitle?: string }

          export default function HeroSection({ title, subtitle }: HeroSectionProps) {
            return (
              <section aria-labelledby="power-welcome-title" data-power-facade="approved-reference" className="w-full bg-[#073b2d] text-white">
                <h1 id="power-welcome-title" className="sr-only">{title || "POWER Primeur et Bar à jus à Alfortville"}</h1>
                {subtitle && <p className="sr-only">{subtitle}</p>}
                <div className="mx-auto max-w-7xl">
                  {/* The complete storefront and all five approved characters remain visible.
                      This is the exact reference crop, not a reconstructed or generated scene. */}
                  <Image
                    src="/brand/facade-power-validee.webp"
                    alt="La devanture POWER validée, avec les personnages mangue, fraise, ananas, banane et tomate devant le panneau Bienvenue chez POWER"
                    width={710}
                    height={319}
                    priority
                    fetchPriority="high"
                    sizes="(min-width: 1280px) 1280px, 100vw"
                    className="block h-auto w-full"
                  />
                  <div className="grid grid-cols-4 gap-1 px-2 py-3 sm:gap-4 sm:px-6 sm:py-4">
                    {benefits.map(({ icon: Icon, title: benefitTitle }) => (
                      <div key={benefitTitle} className="flex min-w-0 flex-col items-center gap-1.5 text-center sm:flex-row sm:gap-3 sm:text-left">
                        <span className="flex h-8 w-8 shrink-0 items-center justify-center rounded-full border border-[#ffcd47]/80 text-[#ffcd47] sm:h-10 sm:w-10"><Icon aria-hidden="true" className="h-4 w-4 sm:h-5 sm:w-5" /></span>
                        <span className="max-w-[10rem] text-[10px] font-medium leading-snug sm:text-xs">{benefitTitle}</span>
                      </div>
                    ))}
                  </div>
                  <div className="px-4 pb-5 pt-1 text-center">
                    <Link href="#marketplace" className="inline-flex min-h-12 w-full max-w-sm items-center justify-center gap-3 rounded-full bg-[#ffcd47] px-6 text-base font-black text-[#073b2d] transition-colors hover:bg-[#ffe18a] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#ffcd47]">
                      Faire mes courses <ArrowRight aria-hidden="true" className="h-5 w-5" />
                    </Link>
                  </div>
                </div>
              </section>
            )
          }
          TSX
          cat > __tests__/power-facade-reference.test.ts <<'TS'
          import { describe, expect, it } from "vitest"
          import { existsSync, readFileSync } from "node:fs"
          import { resolve } from "node:path"
          const source = readFileSync(resolve("components/sections/hero-section.tsx"), "utf8")
          describe("POWER approved storefront integrity", () => {
            it("uses the user's exact reference and preserves the entire frame", () => {
              expect(source).toContain('/brand/facade-power-validee.webp')
              expect(source).not.toContain('power-champ-hero.webp')
              expect(source).not.toContain('object-cover')
              expect(source).not.toContain('min-h-[330px]')
              expect(source).not.toContain('bg-gradient-to-t')
              expect(source).toContain('width={710}')
              expect(source).toContain('height={319}')
              expect(existsSync(resolve("public/brand/facade-power-validee.webp"))).toBe(true)
            })
            it("records an exact unresized crop of the approved image", () => {
              const m = JSON.parse(readFileSync(resolve("public/brand/facade-power-validee.json"), "utf8"))
              expect(m.sourceSha256).toBe('3ddf6e945f973f8e1a8f808c65f454a06b503b892243c531ee1915841bcd0e3b')
              expect(m.crop).toEqual([0,350,710,669])
              expect([m.width,m.height]).toEqual([710,319])
            })
            it("retains the shopping destination and four benefits", () => {
              expect(source).toContain('href="#marketplace"')
              expect(source).toContain('grid-cols-4')
              expect(source).toContain('Faire mes courses')
            })
          })
          TS
      - run: corepack enable
      - run: yarn install --no-immutable
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
      - name: Existing tests, typecheck and build
        run: |
          yarn typecheck > power-facade-evidence/typecheck.txt
          yarn test > power-facade-evidence/tests.txt
          yarn build > power-facade-evidence/build.txt
      - name: Isolated browser rendering of the actual hero component
        run: |
          npm install --prefix /tmp/power-facade-render --no-audit --no-fund esbuild@0.25.9
          python -m playwright install --with-deps chromium
          mkdir -p .power-facade-render
          cat > .power-facade-render/fixture.tsx <<'TSX'
          import React from 'react'
          import {createRoot} from 'react-dom/client'
          import HeroSection from '../components/sections/hero-section'
          createRoot(document.getElementById('root')!).render(<HeroSection />)
          TSX
          cat > .power-facade-render/image.tsx <<'TSX'
          import React from 'react'
          export default function Image({priority,fetchPriority,sizes,...props}:any){return <img {...props}/>}
          TSX
          cat > .power-facade-render/link.tsx <<'TSX'
          import React from 'react'
          export default function Link({prefetch,replace,scroll,...props}:any){return <a {...props}/>}
          TSX
          node <<'JS'
          const esbuild=require('/tmp/power-facade-render/node_modules/esbuild'),path=require('node:path')
          const root=process.cwd(),f=path.join(root,'.power-facade-render')
          esbuild.buildSync({entryPoints:[path.join(f,'fixture.tsx')],outfile:path.join(f,'bundle.js'),bundle:true,platform:'browser',format:'iife',jsx:'automatic',define:{'process.env.NODE_ENV':'"production"'},alias:{'next/image':path.join(f,'image.tsx'),'next/link':path.join(f,'link.tsx'),'@':root}})
          JS
          yarn exec tailwindcss -i app/globals.css -o .power-facade-render/site.css
          ln -s ../public/brand .power-facade-render/brand
          cat > .power-facade-render/index.html <<'HTML'
          <!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>POWER — contrôle de la façade exacte</title><link rel="stylesheet" href="/site.css"><style>body{background:#073b2d;margin:0}</style><body><div id="root"></div><script src="/bundle.js"></script></body></html>
          HTML
          python -m http.server 4173 --bind 127.0.0.1 --directory .power-facade-render > /tmp/power-facade-server.log 2>&1 &
          python - <<'PY'
          import asyncio,json
          from pathlib import Path
          from playwright.async_api import async_playwright
          async def main():
            report={'kind':'isolated browser rendering of actual HeroSection source; not full live homepage','commercialWrites':False,'errors':[],'screens':[]}
            out=Path('power-facade-evidence')
            async with async_playwright() as p:
              browser=await p.chromium.launch()
              for w,h in [(390,844),(320,568),(1280,900)]:
                context=await browser.new_context(viewport={'width':w,'height':h},device_scale_factor=2)
                async def local_only(route):
                  if route.request.method=='GET' and route.request.url.startswith('http://127.0.0.1:4173/'): await route.continue_()
                  else: await route.abort()
                await context.route('**/*',local_only)
                page=await context.new_page()
                page.on('pageerror',lambda error:report['errors'].append(str(error)))
                await page.goto('http://127.0.0.1:4173/',wait_until='networkidle')
                await page.wait_for_function('Array.from(document.images).every(i=>i.complete && i.naturalWidth>0)')
                image=page.locator('img[src="/brand/facade-power-validee.webp"]')
                b=await image.bounding_box()
                assert b and abs(b['width']/b['height']-710/319)<0.015, 'Facade aspect ratio altered'
                assert await image.evaluate('(i)=>i.naturalWidth===710 && i.naturalHeight===319')
                assert await page.evaluate('document.documentElement.scrollWidth <= innerWidth+1')
                button=page.get_by_role('link',name='Faire mes courses')
                bb=await button.bounding_box()
                assert bb and bb['height']>=44 and await button.get_attribute('href')=='#marketplace'
                name=f'POWER_facade_code_{w}.png'
                await page.locator('section[data-power-facade]').screenshot(path=str(out/name))
                report['screens'].append({'file':name,'width':w,'imageFullyVisible':True,'buttonMin44px':True,'noHorizontalOverflow':True})
                await context.close()
              await browser.close()
            (out/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
            assert not report['errors'], report['errors']
          asyncio.run(main())
          PY
      - name: Save only verified facade changes to the preview branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- components/sections/hero-section.tsx public/brand/facade-power-validee.webp public/brand/facade-power-validee.json __tests__/power-facade-reference.test.ts
          git diff --cached --name-only > power-facade-evidence/changed-files.txt
          git commit -m 'fix: show exact approved POWER facade and five characters without cropping'
          git push origin HEAD:fix/unify-power-mascot-design
          git rev-parse HEAD > power-facade-evidence/source-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: POWER-exact-facade-verified
          path: power-facade-evidence/
          if-no-files-found: warn
          retention-days: 7
