name: POWER composition artwork review
on:
  push:
    branches: [fix/unify-power-mascot-design]
    paths: [.github/workflows/power-composition-review.yml]
permissions:
  contents: write
concurrency:
  group: power-composition-review
  cancel-in-progress: false
jobs:
  review:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/unify-power-mascot-design
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded presentation-only changes
        run: python .github/scripts/style-power-compositions.py
      - run: corepack enable
      - run: yarn install --no-immutable
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
      - name: Verify types and all existing tests
        run: |
          mkdir -p power-composition-evidence
          yarn typecheck > power-composition-evidence/typecheck.txt
          yarn test > power-composition-evidence/tests.txt
      - name: Isolated visual renderer
        run: |
          npm install --prefix /tmp/power-render --no-audit --no-fund esbuild@0.25.9
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Render real composition components with fictitious data only
        run: |
          mkdir -p .power-composition-render
          cat > .power-composition-render/fixture.tsx <<'TSX'
          import React from 'react'
          import {createRoot} from 'react-dom/client'
          import CompositionConfigurator from '../components/product/composition-configurator'
          import CompositionCard from '../components/product/composition-card'
          const option=(id:string,name:string,includedByDefault=true,extraPrice=0)=>({id,name,includedByDefault,extraPrice,isRemovable:true})
          const common={id:'visual-only',description:'Données fictives pour contrôler l’affichage. Aucun prix du magasin n’est modifié.',basePrice:6.27,imageUrl:'/wrong-legacy-image.jpg',sizes:[{id:'test',name:'Format de test',price:6.27,isDefault:true,includedChoices:0}]}
          const smoothie={...common,name:'Smoothie à composer',type:'jus',options:[option('m','Mangue'),option('a','Ananas'),option('p','Fruit de la passion'),option('b','Banane',false,0.75)]}
          const salad={...common,id:'salad-test',name:'Salade à composer',type:'salade',options:[option('t','Tomates cerises'),option('av','Avocat'),option('c','Concombre'),option('s','Salade'),option('b','Burrata',false,0.75)]}
          const mode=new URLSearchParams(location.search).get('mode')
          const composition=mode==='salad'?salad:smoothie
          createRoot(document.getElementById('root')!).render(<main className="mx-auto max-w-3xl p-4 pb-12 text-white"><p className="mb-3 text-xs text-[#ffcd47]">POWER · CONTRÔLE DE COMPOSANT</p>{mode==='card'?<CompositionCard composition={smoothie}/>:<><h1 className="mb-5 text-2xl font-bold">{composition.name}</h1><CompositionConfigurator composition={composition}/></>}</main>)
          TSX
          cat > .power-composition-render/cart-mock.ts <<'TS'
          export async function addToCart(){throw new Error('Test visuel : aucune commande autorisée')}
          TS
          cat > .power-composition-render/image-mock.tsx <<'TSX'
          import React from 'react'
          export default function Image({fill,priority,fetchPriority,style,...props}:any){return <img {...props} style={{...(fill?{position:'absolute',inset:0,width:'100%',height:'100%'}:{}),...style}}/>}
          TSX
          node <<'JS'
          const esbuild=require('/tmp/power-render/node_modules/esbuild'),path=require('node:path')
          const root=process.cwd(),f=path.join(root,'.power-composition-render')
          esbuild.buildSync({entryPoints:[path.join(f,'fixture.tsx')],outfile:path.join(f,'bundle.js'),bundle:true,platform:'browser',format:'iife',jsx:'automatic',define:{'process.env.NODE_ENV':'"production"'},alias:{'@/app/actions/cart':path.join(f,'cart-mock.ts'),'next/image':path.join(f,'image-mock.tsx'),'@':root}})
          JS
          yarn exec tailwindcss -i app/globals.css -o .power-composition-render/site.css
          ln -s ../public/brand .power-composition-render/brand
          cat > .power-composition-render/index.html <<'HTML'
          <!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contrôle des recettes POWER</title><link rel="stylesheet" href="/site.css"><style>body{background:#073b2d}.review-label{position:fixed;bottom:0;left:0;right:0;z-index:10000;background:#ffcd47;color:#073b2d;text-align:center;font:700 10px/1.4 Arial;padding:5px;pointer-events:none}</style><body><div id="root"></div><div class="review-label">TEST DU CODE · RECETTES ET PRIX FICTIFS · AUCUNE COMMANDE</div><script src="/bundle.js"></script></body></html>
          HTML
          python -m http.server 4173 --bind 127.0.0.1 --directory .power-composition-render >/tmp/power-render.log 2>&1 &
          python - <<'PY'
          import asyncio,json,re
          from pathlib import Path
          from playwright.async_api import async_playwright
          async def main():
            out=Path('power-composition-evidence');report={'kind':'actual composition components with mocked cart and fictitious prices','errors':[],'screens':[]}
            async with async_playwright() as p:
              browser=await p.chromium.launch()
              context=await browser.new_context(viewport={'width':390,'height':844},device_scale_factor=2,is_mobile=True,has_touch=True)
              async def local_only(route):
                if route.request.method!='GET' or not route.request.url.startswith('http://127.0.0.1:4173/'): await route.abort()
                else: await route.continue_()
              await context.route('**/*',local_only)
              page=await context.new_page();page.on('pageerror',lambda error:report['errors'].append(str(error)))
              for mode,name in [('card','POWER_carte_smoothie.png'),('smoothie','POWER_smoothie_composition.png'),('salad','POWER_salade_composition.png')]:
                await page.goto('http://127.0.0.1:4173/?mode='+mode,wait_until='networkidle')
                await page.wait_for_function('Array.from(document.images).every(i=>i.complete && i.naturalWidth>0)')
                assert await page.locator('img[src*="wrong-legacy"]').count()==0
                if mode=='salad':
                  assert await page.locator('[data-composition-kind="salad"]').count()==1
                  assert await page.locator('img[src*="tropic"]').count()==0
                else: assert await page.locator('[data-composition-artwork="mangue-ananas-passion"]').count()==1
                assert await page.evaluate('document.documentElement.scrollWidth <= innerWidth + 1')
                await page.screenshot(path=str(out/name),full_page=True);report['screens'].append(name)
                if mode=='smoothie':
                  await page.get_by_role('button',name=re.compile('Banane')).click()
                  assert await page.locator('[data-composition-artwork="mangue-ananas-passion"]').count()==0
                  assert await page.locator('[data-ingredient-mode="selected"]').count()==1
                  report['selectionUpdatesArtwork']=True
              await browser.close()
            (out/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
            if report['errors']: raise RuntimeError(str(report['errors']))
          asyncio.run(main())
          PY
      - name: Commit only tested composition views on preview branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- components/product/composition-card.tsx components/product/composition-mobile-item.tsx components/product/composition-sheet.tsx components/product/composition-configurator.tsx
          git diff --cached --stat > power-composition-evidence/changed-files.txt
          git commit -m 'style: unify smoothie and salad views with verified POWER recipe artwork'
          git push origin HEAD:fix/unify-power-mascot-design
          git rev-parse HEAD > power-composition-evidence/source-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: POWER-compositions-verified
          path: power-composition-evidence/
          retention-days: 7
          if-no-files-found: warn
