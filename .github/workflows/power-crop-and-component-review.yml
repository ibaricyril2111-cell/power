name: POWER product detail visual verification

on:
  push:
    branches: [fix/unify-power-mascot-design]
    paths:
      - .github/workflows/power-crop-and-component-review.yml
      - components/product/product-modal.tsx
      - components/product/quantity-selector.tsx

# The original artwork import is complete. This check only reads code and renders it.
permissions:
  contents: read

concurrency:
  group: power-product-detail-review
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install --no-immutable
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
      - name: Existing type and regression checks
        run: yarn typecheck && yarn test
      - name: Install isolated renderer without changing app dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium
          npm install --prefix /tmp/power-render --no-audit --no-fund esbuild@0.25.9
      - name: Render actual source with explicit fixtures and no database
        run: |
          mkdir -p .power-ui-review power-component-evidence
          cat > .power-ui-review/fixture.tsx <<'TSX'
          import React from 'react'
          import {createRoot} from 'react-dom/client'
          import ProductModal from '../components/product/product-modal'
          const variant=new URLSearchParams(location.search).get('variant')
          const weighed=variant==='weighed'
          const product={id:'visual-test-only',name:weighed?'Tomates cerises':'Fraises Gariguette',price:1.23,promoPrice:variant==='promo'?0.99:null,unit:weighed?'kg':'barquette',image:'/unused-normal-photo.jpg',description:'Données fictives de contrôle : aucun tarif du magasin ne change.',category:'Fruits',inStock:variant!=='unavailable',organic:false,currentStock:weighed?0.5:10}
          if(variant==='long'){
            product.name='Fraises Gariguette — sélection du magasin POWER'
            product.description=product.description.repeat(20)
          }
          createRoot(document.getElementById('root')!).render(<ProductModal product={product} isOpen onClose={()=>{}}/>)
          TSX
          cat > .power-ui-review/cart-mock.ts <<'TS'
          export async function addToCart(){throw new Error('Visual fixture: database writes forbidden')}
          TS
          cat > .power-ui-review/image-mock.tsx <<'TSX'
          import React from 'react'
          export default function Image({fill,priority,fetchPriority,style,...props}:any){return <img {...props} style={{...(fill?{position:'absolute',inset:0,width:'100%',height:'100%'}:{}),...style}}/>}
          TSX
          node <<'JS'
          const esbuild=require('/tmp/power-render/node_modules/esbuild')
          const path=require('node:path')
          const root=process.cwd(),f=path.join(root,'.power-ui-review')
          esbuild.buildSync({entryPoints:[path.join(f,'fixture.tsx')],outfile:path.join(f,'bundle.js'),bundle:true,platform:'browser',format:'iife',jsx:'automatic',define:{'process.env.NODE_ENV':'"production"'},alias:{'@/app/actions/cart':path.join(f,'cart-mock.ts'),'next/image':path.join(f,'image-mock.tsx'),'@':root}})
          JS
          yarn exec tailwindcss -i app/globals.css -o .power-ui-review/site.css
          ln -s ../public/brand .power-ui-review/brand
          cat > .power-ui-review/index.html <<'HTML'
          <!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fiche produit POWER — contrôle du code</title><link rel="stylesheet" href="/site.css"><style>body{background:#073b2d}.review-label{position:fixed;bottom:0;left:0;right:0;z-index:10000;text-align:center;background:#ffcd47;color:#073b2d;font:700 10px/1.4 Arial;padding:3px;pointer-events:none}</style><body><div id="root"></div><div class="review-label">TEST DU CODE · PRIX FICTIFS · AUCUNE COMMANDE RÉELLE</div><script src="/bundle.js"></script></body></html>
          HTML
          python -m http.server 4173 --bind 127.0.0.1 --directory .power-ui-review > /tmp/power-render-server.log 2>&1 &
          python - <<'PY'
          import asyncio,json,subprocess
          from pathlib import Path
          from playwright.async_api import async_playwright,expect

          async def main():
            out=Path('power-component-evidence')
            report={'sourceCommit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'kind':'browser render of actual ProductModal and QuantitySelector source; next/image replaced by a native img for isolated rendering','fixture':'fictitious prices; mocked addToCart; no production data or writes','screens':[],'checks':[],'errors':[]}
            async with async_playwright() as p:
              browser=await p.chromium.launch()
              for width,height in [(320,568),(375,667),(390,844),(430,932),(1280,900)]:
                context=await browser.new_context(viewport={'width':width,'height':height},device_scale_factor=2,is_mobile=width<768,has_touch=width<768)
                async def local_only(route):
                  if not route.request.url.startswith('http://127.0.0.1:4173/') or route.request.method!='GET':
                    await route.abort()
                  else:
                    await route.continue_()
                await context.route('**/*',local_only)
                page=await context.new_page()
                page.on('pageerror',lambda error:report['errors'].append(str(error)))

                async def load(variant='standard'):
                  await page.goto('http://127.0.0.1:4173/?variant='+variant,wait_until='networkidle')
                  await page.get_by_role('dialog').wait_for()
                  await page.wait_for_function('Array.from(document.images).every(i=>i.complete && i.naturalWidth>0)')

                async def check_visible_action():
                  button=page.get_by_role('button',name='Ajouter au panier',exact=True)
                  rect=await button.bounding_box()
                  assert rect and rect['y']>=0 and rect['y']+rect['height']<=height-10,'Purchase action outside viewport'
                  assert rect['height']>=44,'Touch target too small'
                  assert await page.locator('[data-power-product-body]').evaluate('(e)=>e.scrollWidth <= e.clientWidth+1'),'Horizontal body overflow'
                  box=await page.get_by_role('dialog').bounding_box()
                  assert box['x']>=0 and box['x']+box['width']<=width+1,'Dialog outside viewport'
                  return rect

                await load()
                assert await page.locator('[data-mascot-key="fraise"]').count()==1
                assert await page.locator('img[src*="unused-normal-photo"]').count()==0
                rect=await check_visible_action()
                image=await page.locator('[data-power-product-image]').bounding_box()
                assert image['height']<=(211 if width<768 else 281),'Mascot is oversized'
                spin=page.get_by_role('spinbutton')
                assert await spin.evaluate('(e)=>getComputedStyle(e).color')=='rgb(255, 255, 255)','Quantity text unreadable on green'
                await expect(spin).to_have_value('1')
                await page.get_by_role('button',name='Augmenter la quantité',exact=True).click()
                await expect(spin).to_have_value('2')
                assert '2.46' in await page.locator('[data-power-product-footer]').inner_text(),'Line total changed'
                await page.get_by_role('button',name='Diminuer la quantité',exact=True).click()
                await expect(spin).to_have_value('1')
                await expect(page.get_by_role('button',name='Diminuer la quantité',exact=True)).to_be_disabled()
                await spin.fill('999')
                await expect(spin).to_have_value('10')
                await expect(page.get_by_role('button',name='Augmenter la quantité',exact=True)).to_be_disabled()
                await load()
                # Keep the initial keyboard focus, but do not obscure text with a selection.
                await page.get_by_role('button',name='Close',exact=True).focus()
                name=f'POWER_fiche_{width}x{height}.png'
                await page.screenshot(path=str(out/name),full_page=True)
                report['screens'].append(name)
                report['checks'].append({'viewport':[width,height],'imageHeight':image['height'],'actionVisible':True,'stockAndTotals':True})

                await load('long')
                await check_visible_action()
                await page.locator('[data-power-product-body]').evaluate('(e)=>e.scrollTop=e.scrollHeight')
                await check_visible_action()
                await load('unavailable')
                await expect(page.get_by_role('button',name='Ajouter au panier',exact=True)).to_be_disabled()
                await load('promo')
                assert '0.99' in await page.locator('[data-power-product-footer]').inner_text()
                await load('weighed')
                weight=page.get_by_role('spinbutton')
                first=int(await weight.input_value())
                await page.get_by_role('button',name='Ajouter 100 grammes',exact=True).click()
                await expect(weight).to_have_value(str(first+100))
                await weight.fill('9999')
                await expect(weight).to_have_value('500')
                await expect(page.get_by_role('button',name='Ajouter 100 grammes',exact=True)).to_be_disabled()
                assert await page.locator('[data-mascot-key="tomate"]').count()==1
                await context.close()
              await browser.close()
            (out/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
            if report['errors']:raise RuntimeError('Browser errors: '+str(report['errors']))
          asyncio.run(main())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: POWER-product-detail-verified
          path: power-component-evidence/
          if-no-files-found: warn
          retention-days: 7
