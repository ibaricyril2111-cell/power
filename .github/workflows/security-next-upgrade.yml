name: Temporary Next.js security upgrade

on:
  push:
    branches:
      - fix/unify-power-mascot-design

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/unify-power-mascot-design
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - name: Upgrade Next.js security patch
        run: yarn up next@16.3.8
      - name: Verify
        run: |
          yarn typecheck
          yarn test
      - name: Remove temporary workflow and commit lockfile
        run: |
          rm .github/workflows/security-next-upgrade.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json yarn.lock .github/workflows/security-next-upgrade.yml
          git commit -m "security: upgrade Next.js to 16.3.8"
          git push origin HEAD:fix/unify-power-mascot-design
